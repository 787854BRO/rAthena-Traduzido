  - Command: sta
    Help: |
      Params: <quantidade>
      Aumenta o atributo STA na quantidade informada.
  - Command: stat_all
    Aliases:
      - allstat
      - allstats
      - statall
      - statsall
    Help: |
      Params: <valor>
      Aumenta todos os atributos na quantidade informada (máximo se nenhum valor for informado).
  - Command: stats
    Help: |
      Exibe os atributos do personagem no chat.
  - Command: statuspoint
    Aliases:
      - stpoint
    Help: |
      Params: <quantidade de pontos>
      Concede a quantidade informada de pontos de atributos.
  - Command: stockall
    Help: |
      Params: [<tipo de item>]
      Transfere itens do carrinho para o inventário. Se nenhum tipo for informado, transfere todos os itens.
  - Command: storage
    Help: |
      Abre o Armazém.
  - Command: storeall
    Help: |
      Move todos os seus itens para o Armazém.
  - Command: storagelist
    Help: |
      Exibe uma lista dos itens armazenados.
  - Command: str
    Help: |
      Params: <quantidade>
      Aumenta a FOR na quantidade informada.
  - Command: stylist
    Help: |
      Abre a interface do Estilista.
  - Command: summon
    Help: |
      Params: <nome ou ID do monstro> {<duração>}
      Invoca o monstro informado, que passará a tratá-lo como mestre.
      Se uma duração for especificada, ele permanecerá ao seu lado até esse tempo terminar.
  - Command: tonpc
    Help: |
      Params: <nome do NPC>
      Teleporta você até o NPC informado.
  - Command: trade
    Help: |
      Params: <nome do personagem>
      Abre uma janela de troca com outro jogador.
  - Command: trait_all
    Aliases:
      - alltrait
      - alltraits
      - traitall
      - traitsall
    Help: |
      Params: <valor>
      Aumenta todos os atributos especiais na quantidade informada (máximo se nenhum valor for informado).
  - Command: traitpoint
    Aliases:
      - trpoint
    Help: |
      Params: <quantidade de pontos>
      Concede a quantidade informada de pontos de atributos especiais.
  - Command: unban
    Aliases:
      - unbanish
    Help: |
      Params: <nome>
      Remove o banimento de uma conta.
  - Command: undisguise
    Help: |
      Restaura sua aparência normal.
  - Command: undisguiseall
    Help: |
      Restaura a aparência normal de todos os jogadores conectados.
  - Command: undisguiseguild
    Help: |
      Restaura a aparência normal de todos os membros da guilda.
  - Command: unjail
    Aliases:
      - discharge
    Help: |
      Params: <nome do personagem>
      Liberta o personagem da prisão.
  - Command: unloadnpc
    Help: |
      Params: <nome do NPC>
      Descarrega o NPC informado.
  - Command: unloadnpcfile
    Help: |
      Params: <caminho>
      Descarrega o arquivo de script informado.
  - Command: unmute
    Help: |
      Params: <nome do personagem>
      Remove o silêncio do personagem informado.
  - Command: uptime
    Help: |
      Exibe há quanto tempo o servidor está online.
  - Command: users
    Help: |
      Exibe a distribuição dos jogadores por mapa no servidor.
  - Command: useskill
    Help: |
      Params: <ID da habilidade> <nível da habilidade> <alvo>
      Usa a habilidade informada no alvo.
  - Command: version
    Help: |
      Exibe a versão SVN do servidor.
  - Command: vip
    Help: |
      Params: <+/- tempo> <nome do personagem>
      Concede ou remove o status VIP de um jogador por um período determinado.
      Unidades de tempo: y/a, m, d/j, h, mn, s
  - Command: vit
    Help: |
      Params: <quantidade>
      Aumenta a VIT na quantidade informada.
  - Command: where
    Help: |
      Params: <nome do personagem>
      Exibe a localização do personagem informado.
  - Command: whereis
    Help: |
      Params: <nome ou ID do monstro>
      Exibe os mapas onde o monstro informado aparece normalmente.
  - Command: who
    Aliases:
      - whois
    Help: |
      Params: [<nome>]
      Exibe uma lista dos jogadores online com seus grupos e guildas.
  - Command: who2
    Help: |
      Params: [<nome>]
      Exibe uma lista dos jogadores online com suas classes.
  - Command: who3
    Help: |
      Params: [<nome>]
      Exibe uma lista dos jogadores online com suas localizações.
  - Command: whodrops
    Help: |
      Params: <nome ou ID do item>
      Exibe quais monstros derrubam o item informado (priorizando os maiores índices de drop).
  - Command: whogm
    Help: |
      Params: [texto]
      Igual aos comandos @who + @who2 + @who3, porém apenas para GMs.
  - Command: whomap
    Help: |
      Params: <nome do mapa>
      Igual ao @who, mas apenas para o mapa informado.
  - Command: whomap2
    Help: |
      Params: <nome do mapa>
      Igual ao @who2, mas apenas para o mapa informado.
  - Command: whomap3
    Help: |
      Params: <nome do mapa>
      Igual ao @who3, mas apenas para o mapa informado.
  - Command: wis
    Help: |
      Params: <quantidade>
      Aumenta o atributo WIS na quantidade informada.
  - Command: zeny
    Help: |
      Params: <quantidade>
      Concede a quantidade informada de Zeny.

Footer:
  Imports:
    - Path: conf/import/atcommands.yml
