###########################################################################
# Atcommand Database
###########################################################################
#
# Atcommand Settings
#
###########################################################################
# - Command                  Command name.
#   Aliases:                 Aliases for the command. (Optional)
#     - <AliasName>
#   Help                     Help message for the command. (Optional)
###########################################################################

Header:
  Type: ATCOMMAND_DB
  Version: 1

Body:
  - Command: accept
    Help: |
      Aceita um convite para o duelo.
  - Command: accinfo
    Aliases:
      - accountinfo
    Help: |
      Params: <nome do personagem>. Busca por um personagem com o nome <nome do personagem>. Você pode usar % como caractere curinga.
      Params: <ID da conta>. Busca as informações de login da conta <ID da conta>.
      Exibe informações básicas sobre a conta com o ID <ID da conta> ou que possua o personagem <nome do personagem>.
  - Command: addfame
    Aliases:
      - famepoint
      - famepoints
    Help: |
      Params: <quantidade>.
      Adiciona ou reduz os pontos de fama do jogador em <quantidade>.
  - Command: addperm
    Help: |
      Params: <nome_da_permissao>
      Adiciona temporariamente uma permissão a um jogador.
  - Command: addwarp
    Help: |
      Params: <Nome do mapa> <x cord> <y cord> <Nome do NPC>
  - Command: adjgroup
    Help: |
      Params: <level> <nome do personagem>
      Faz um ajuste temporário no nível de grupo de um jogador.
  - Command: adopt
    Help: |
      Params: <nome do personagem>
      Adota o jogador especificado <nome do personagem>.
  - Command: agi
    Help: |
      Params: <quantidade>
      Aumenta a AGI pela quantidade informada.
  - Command: agitend
    Help: |
      Termina a Guerra do Emperium
  - Command: agitend2
    Help: |
      Termina a Guerra do Emperium SE
  - Command: agitend3
    Help: |
      Termina a Guerra do Emperium TE
  - Command: agitstart
    Help: |
      Inicia a Guerra do Emperium
  - Command: agitstart2
    Help: |
      Inicia a Guerra do Emperium SE
  - Command: agitstart3
    Help: |
      Inicia a Guerra do Emperium TE
  - Command: alive
    Help: |
      Ressuscita o seu personagem da morte.
  - Command: allowks
    Help: |
      Ativa ou desativa o kill stealing (KS) neste mapa.
  - Command: allskill
    Aliases:
      - allskills
      - skillall
      - skillsall
    Help: |
      Concede a você todas as habilidades.
  - Command: auction
    Help: |
      Abre a janela de leilão.
  - Command: autoloot
    Help: |
      Params: <on|off|#>
      Faz com que os itens caiam direto no seu inventário.
  - Command: autolootitem
    Aliases:
      - alootid
    Help: |
      Params: Nenhum. Mostra uma ajuda curta.
      Params: +<ID do Item> para adicionar um ID de item
      Params: -<ID do Item> para remover um ID de item
      Params: reset para remover todos os IDs de itens
      Faz com que os itens deste ID de item específico caiam direto no seu inventário.
  - Command: autoloottype
    Aliases:
      - aloottype
    Help: |
      Params: Nenhum. Mostra uma ajuda curta.
      Params: +<nome/ID do tipo> para adicionar um tipo de item
      Params: -<nome/ID do tipo> para remover um tipo de item
      Params: reset para remover todos os tipos de itens
      Faz com que os itens deste tipo de item específico caiam direto no seu inventário.
      Lista de Tipos:
        Itens de Cura = 0, Usaveis = 2, Etc = 3, Armas = 4, Armaduras = 5,
        Cartas = 6, Ovo de Pet = 7, Arm. de pets = 8, Munição = 10
  - Command: autotrade
    Aliases:
      - at
    Help: |
      Permite que você abra uma loja de vendas enquanto estiver offline.
  - Command: ban
    Aliases:
      - banish
    Help: |
      Params: <tempo> <nome>\n" "Bane temporariamente uma conta.
      uso do tempo: ajuste (valor +/-) e elemento (y/a para ano, m para mês, d/j para dia, h para hora, mn para minuto, s para segundo)
      Exemplo: @ban +1m-2mn1s-6y testplayer
  - Command: baselevelup
    Aliases:
      - baselevel
      - baselvl
      - baselvup
      - baselvlup
      - blevel
      - blvl
      - lvup
    Help: |
      Params: <número de níveis>
      Aumenta o seu nível de base na quantidade de níveis desejada.
  - Command: bodystyle
    Help: |
      Params: <ID da classe>
      Params: off. Restaura o estilo de corpo padrão da classe.
      Altera o estilo de corpo do personagem para <ID da classe>.
  - Command: breakguild
    Help: |
      Desfaz a guilda do personagem vinculado.
      Você precisa ser o líder da guilda para usar este comando.
  - Command: broadcast
    Help: |
      Params: <mensagem>
      Transmite uma mensagem global com o seu nome (em amarelo).
  - Command: camerainfo
    Aliases:
      - viewpointvalue
      - setcamera
    Help: |
      Mostra ou atualiza as configurações de câmera do cliente.
  - Command: cart
    Help: |
      Params: <ID do carrinho>
      Concede ou remove o carrinho de um jogador e também altera o visual do carrinho.
      IDs de carrinhos disponíveis:
          0: remove o carrinho
        1-5: carrinhos normais
        6-9: carrinhos novos
  - Command: cartlist
    Help: |
      Exibe uma lista com os itens que estão no carrinho.
  - Command: cash
    Help: |
      Params: <quantidade> - Concede a quantidade especificada de pontos de cash.
  - Command: changedress
    Aliases:
      - nocosplay
    Help: |
      Remove todos os visuais do personagem.
  - Command: changegm
    Help: |
      Params: <nome do personagem>
      Altera o líder da sua guilda (Você precisa ser o líder da guilda)
  - Command: changeleader
    Help: |
      Params: <nome do personagem>
      Altera o líder do seu grupo (Você precisa ser o líder do grupo)
  - Command: channel
    Aliases:
      - main
    Help: |
      Se você executar este comando sem nenhum parâmetro, receberá informações de ajuda mais detalhadas.
  - Command: changecharsex
    Help: |
      Altera o sexo do seu personagem.
  - Command: changelook
    Help: |
      Params: <posição> <ID do visual>
      Altera a aparência do jogador para o ID de visual especificado.
      Posições disponíveis:
        1: Topo (Cabeça)
        2: Meio (Cabeça)
        3: Baixo (Cabeça)
        4: Arma
        5: Escudo
        6: Sapatos
        7: Capa
        8: Estilo do corpo
  - Command: changesex
    Help: |
      Altera o sexo da sua conta.
  - Command: char_ban
    Aliases:
      - charban
    Help: |
      Params: <tempo> <nome>
      Bane temporariamente um personagem.
      uso do tempo: ajuste (valor +/-) e elemento (y/a para ano, m para mês, d/j para dia, h para hora, mn para minuto, s para segundo)
      Exemplo: @char_ban +1m-2mn1s-6y testplayer
  - Command: char_block
    Aliases:
      - block
    Help: |
      Params: <nome do personagem>
      Bloqueia permanentemente uma conta.
  - Command: char_unban
    Aliases:
      - charunban
    Help: |
      Params: <nome>
      Desbane um personagem.
  - Command: char_unblock
    Aliases:
      - unblock
    Help: |
      Params: <nome do personagem>
      Desbloqueia uma conta.
  - Command: charcommands
    Help: |
      Exibe uma lista de comandos de personagem (charcommands) que você pode usar.
  - Command: checkquest
    Help: |
      Params: <ID da missão>
      Mostra informações de status da missão com o ID da missão <ID da missão>.
  - Command: clanspy
    Help: |
      Params: <nome|id do clã>
      Você receberá todas as mensagens do chat do clã (O registro de chat deve estar ativado)
  - Command: cleanarea
    Aliases:
      - cleararea
    Help: |
      Exclui os itens do chão que estão dentro do seu campo de visão.
  - Command: cleanmap
    Aliases:
      - clearmap
    Help: |
      Exclui os itens do chão no mapa atual.
  - Command: clearcart
    Help: |
      Exclui todos os itens que estão no carrinho.
  - Command: cleargstorage
    Help: |
      Exclui todos os itens do armazém da guilda.
  - Command: clearstorage
    Help: |
      Exclui todos os itens do armazém.
  - Command: clearweather
    Help: |
      Interrompe todos os efeitos climáticos no mapa atual.
  - Command: clone
    Help: |
      Params: <nome do personagem>
      Invoca um clone de suporte do jogador informado.
  - Command: cloneequip
    Aliases:
      - eqclone
    Help: |
      Params: <nome do personagem>
      Params: <ID do personagem>
      Copia os equipamentos do jogador <nome do personagem/ID do personagem>.
  - Command: clonestat
    Aliases:
      - stclone
    Help: |
      Params: <nome do personagem>
      Params: <ID do personagem>
      Copia os valores de atributos do jogador <nome do personagem/ID do personagem>.
  - Command: clouds
    Help: |
      Faz com que todos os mapas fiquem com o efeito climático nublado.
  - Command: clouds2
    Help: |
      Faz com que todos os mapas fiquem com um outro efeito climático nublado.
  - Command: commands
    Help: |
      Exibe uma lista de comandos (atcommands) que você pode usar.
  - Command: completequest
    Help: |
      Params: <ID da missão>
      Completa a missão com o ID da missão <ID da missão>.
  - Command: con
    Help: |
      Params: <quantidade>
      Aumenta a CON pela quantidade informada.
  - Command: costume
    Help: |
      Params: <visual>
      Altera a aparência visível do jogador para a do <visual> selecionado.
      Visuais disponíveis:
        Hanbok
        Oktoberfest
        Summer (Verão)
        Wedding (Casamento)
        Xmas (Natal)
  - Command: crt
    Help: |
      Params: <quantidade>
      Aumenta o CRT pela quantidade informada.
  - Command: day
    Help: |
      Desativa o modo noturno e restaura a iluminação regular, afetando todos os personagens.
  - Command: delitem
    Help: |
      Params: <nome do item> <quantidade>
      Params: <ID do item> <quantidade>
      Exclui a <quantidade> do item especificado <nome/ID do item> do inventário do jogador.
  - Command: dex
    Help: |
      Params: <quantidade>
      Aumenta a DEX pela quantidade informada.
  - Command: disguise
    Help: |
      Params: <nome/ID do monstro>
      Altera a sua aparência para os outros jogadores, transformando você em um monstro.
  - Command: disguiseall
    Help: |
      Params: <nome/ID do monstro>
      Transforma todos os personagens online em monstros.
  - Command: disguiseguild
    Help: |
      Params: <nome/ID do monstro>
      Transforma todos os personagens online de uma guilda em monstros.
  - Command: displayskill
    Help: |
      Params: <ID da habilidade> {<nível da habilidade>}
      Exibe a animação de uma habilidade sem realmente usá-la.
  - Command: displayskillcast
    Help: |
      Params: <ID da habilidade> {<nível da habilidade> <alvo no chão> <tempo de conjuração>}
      Exibe a animação de conjuração de uma habilidade sem realmente conjurá-la.
  - Command: displayskillunit
    Help: |
      Params: <ID da unidade de habilidade> {<nível da habilidade> <alcance>}
      Exibe a animação da unidade de habilidade sem realmente usar a habilidade.
  - Command: displaystatus
    Help: |
      Params: <ID do status> <sinalizador> <tempo> {<val1> <val2> <val3>}
      Exibe a animação de uma alteração de status sem realmente aplicar essa alteração.
  - Command: divorce
    Help: |
      Divorcia o jogador.
  - Command: doom
    Help: |
      Mata todos os personagens que NÃO forem GMs no servidor.
  - Command: doommap
    Help: |
      Mata todos os personagens que não forem GMs no mapa.
  - Command: dropall
    Help: |
      Params: [<tipo de item>]
      Joga todas as suas posses no chão. Se nenhum tipo for especificado, derrubará todos os itens.
  - Command: duel
    Help: |
      Inicia um duelo.
  - Command: dye
    Aliases:
      - ccolor
    Help: |
      Params: <nº da paleta de roupas>
      Altera a cor das roupas do seu personagem.
  - Command: effect
    Help: |
      Params: <id do efeito> [<sinalizador>]
      Concede um efeito ao seu personagem.
  - Command: email
    Help: |
      Params: <e-mail atual> <novo e-mail>
      Altera o endereço de e-mail da sua conta.
  - Command: enchantgradeui
    Help: |
      Abre a interface (UI) de grau de encantamento.
  - Command: erasequest
    Help: |
      Params: <ID da missão>
      Remove a missão <ID da missão> do registro de missões.
  - Command: evilclone
    Help: |
      Params: <nome do personagem>
      Invoca um clone agressivo do jogador informado.
  - Command: exp
    Help: |
      Exibe os níveis atuais e o progresso em %.
  - Command: fakename
    Help: |
      Params: <nome>
      Altera temporariamente o seu nome para a sua escolha.
  - Command: feelreset
    Help: |
      Reseta os mapas marcados de um Mestre Taekwon (Gladiador Estelar).
  - Command: fireworks
    Help: |
      Faz com que todos os mapas fiquem com o efeito climático de fogos de artifício.
  - Command: fog
    Help: |
      Faz com que todos os mapas fiquem com o efeito climático de névoa.
  - Command: font
    Help: |
      Params: <tipo> - valor entre 0-9
      Define a fonte do cliente para o <tipo> escolhido.
      Tipos disponíveis:
        0: Padrão
        1: RixLoveangel
        2: RixSquirrel
        3: NHCgogo
        4: RixDiary
        5: RixMiniHeart
        6: RixFreshman
        7: RixKid
        8: RixMagic
        9: RixJJangu
  - Command: fontcolor
    Help: |
      Params: <nome_da_cor>
      Define a cor da fonte do chat de canal apenas para o personagem que executou o comando.
  - Command: follow
    Help: |
      Params: <nome do personagem>
      Segue um jogador.
  - Command: fullstrip
    Help: |
      Params: <nome do personagem>
      Remove todos os itens equipados atualmente por <nome do personagem>.
  - Command: gat
    Help: |
      Para fins de depuração (você inspeciona ao redor do gat)
  - Command: guildlevelup
    Aliases:
      - glevel
      - glvl
      - guildlevel
      - guildlvl
      - guildlvlup
      - guildlvup
    Help: |
      Params: <nº de níveis>
      Aumenta o nível da Guilda na quantidade de níveis desejada.
  - Command: gmotd
    Help: |
      Transmite a Mensagem do Dia (Motd) para todos os jogadores.
  - Command: go
    Help: |
      Params: <nome/número da cidade>
      Teleporta você para uma cidade.
      -3: (Ponto de Memo 2)  14: louyang         
      -2: (Ponto de Memo 1)  15: ponto inicial    
      -1: (Ponto de Memo 0)  16: prisão/calabouço 
       0: prontera              17: jawaii             
       1: morocc                18: ayothaya       
       2: geffen                  19: einbroch       
       3: payon                  20: lighthalzen
       4: alberta                 21: einbech
       5: izlude                   22: hugel
       6: aldebaran           23: rachel
       7: xmas (lutie)        24: veins
       8: comodo               25: brasilis
       9: yuno                     
      10: amatsu               
      11: gonryun              
      12: umbala               
      13: niflheim              
  - Command: grade
    Help: |
      Params: <posição do equipamento> <+/- quantidade>
  - Command: guild
    Help: |
      Params: <nome_da_guilda>
      Cria uma guilda.
  - Command: guildrecall
    Help: |
      Params: <nome ou ID da guilda>
      Teleporta todos os membros da guilda que estiverem online para a sua posição.
  - Command: guildspy
    Help: |
      Params: <nome ou ID da guilda>
      Você receberá todas as mensagens do chat da guilda (é necessário que o registro de chat esteja ativado).
  - Command: guildstorage
    Aliases:
      - gstorage
    Help: |
      Abre o Armazém da Guilda.
  - Command: gvgoff
    Aliases:
      - gpvpoff
    Help: |
      Desativa o GvG no mapa atual.
  - Command: gvgon
    Aliases:
      - gpvpon
    Help: |
      Ativa o GvG no mapa atual.
  - Command: hair_color
    Aliases:
      - haircolor
      - hcolor
    Help: |
      Params: <número da paleta de cabelo>
      Altera a cor do seu cabelo.
  - Command: hair_style
    Aliases:
      - hairstyle
      - hstyle
    Help: |
      Params: <número do penteado>
      Altera o seu penteado.
  - Command: hatch
    Help: |
      Choca um ovo da lista de ovos de mascotes do seu inventário.
  - Command: hatereset
    Help: |
      Remove todas as marcações de monstros do Mestre Taekwon.
  - Command: heal
    Help: |
      Params: [<HP> <SP>]
      Recupera a quantidade desejada de HP e SP. Se nenhum valor for informado, recupera totalmente ambos.
  - Command: healap
    Help: |
      Params: [<AP>]
      Recupera a quantidade desejada de AP. Se nenhum valor for informado, recupera todo o AP.
  - Command: help
    Aliases:
      - h
    Help: |
      Params: <comando>
      Exibe a ajuda do comando informado.
  - Command: hide
    Help: |
      Torna seu personagem invisível (invisibilidade de GM). Use novamente para voltar a ficar visível.
  - Command: hidenpc
    Help: |
      Params: <nome do NPC>
      Oculta um NPC.
  - Command: homevolution
    Aliases:
      - homevolve
    Help: |
      Evolui o seu Homúnculo, caso seja possível.
  - Command: homfriendly
    Help: |
      Params: <nível de intimidade> - valor entre 0 e 1000
      Define o nível de intimidade do seu Homúnculo.
  - Command: homhungry
    Help: |
      Params: <nível de fome> - valor entre 0 e 100
      Define o nível de fome do seu Homúnculo.
  - Command: hominfo
    Help: |
      Exibe as informações do Homúnculo.
  - Command: homlevel
    Aliases:
      - hlvl
      - hlevel
      - homlvl
      - homlvup
    Help: |
      Params: <nível>
      Aumenta o nível do Homúnculo na quantidade informada.
  - Command: hommutate
    Help: |
      Params: <ID do Homúnculo mutado>
      Transforma o seu Homúnculo no Homúnculo mutado informado, caso seja possível.
  - Command: homshuffle
    Help: |
      Recalcula os atributos do Homúnculo como se ele tivesse evoluído novamente desde o nível 1.
  - Command: homstats
    Help: |
      Exibe os atributos do Homúnculo.
  - Command: homtalk
    Help: |
      Params: <mensagem>
      Faz o Homúnculo dizer a mensagem informada.
  - Command: identify
    Help: |
      Abre a janela de identificação caso haja itens não identificados no seu inventário.
  - Command: identifyall
    Help: |
      Identifica automaticamente todos os itens não identificados do seu inventário.
  - Command: idsearch
    Help: |
      Params: <parte_do_nome_do_item>
      Procura todos os itens cujo nome contenha o texto informado.
  - Command: int
    Help: |
      Params: <quantidade>
      Aumenta a INT na quantidade informada.
  - Command: invite
    Help: |
      Convida um jogador para um duelo.
  - Command: item
    Help: |
      Params: <nome ou ID do item> <quantidade>
      Obtém o item desejado.
  - Command: item2
    Help: |
      Params: <nome ou ID do item> <quantidade> <identificado> <refino> <quebrado> <Carta1> <Carta2> <Carta3> <Carta4>
      Obtém o item desejado com os atributos especificados.
  - Command: itembound
    Help: |
      Params: <nome ou ID do item> <quantidade> <tipo de vínculo>
      Cria um item vinculado ao personagem.
      Esses itens não podem ser descartados, vendidos, colocados em loja, leiloados ou enviados por correio e, em alguns casos, também não podem ser negociados ou armazenados.
      Tipos de vínculo disponíveis:
        1: Conta
        2: Guilda
        3: Grupo
        4: Personagem
  - Command: itembound2
    Help: |
      Params: <nome ou ID do item> <quantidade> <identificado> <refino> <quebrado> <Carta1> <Carta2> <Carta3> <Carta4> <tipo de vínculo>
      Cria um item vinculado ao personagem.
      Esses itens não podem ser descartados, vendidos, colocados em loja, leiloados ou enviados por correio e, em alguns casos, também não podem ser negociados ou armazenados.
      Tipos de vínculo disponíveis:
        1: Conta
        2: Guilda
        3: Grupo
        4: Personagem
  - Command: iteminfo
    Aliases:
      - ii
    Help: |
      Params: <nome ou ID do item>
      Exibe informações do item (tipo, preço, etc.).
  - Command: itemlist
    Aliases:
      - inventorylist
    Help: |
      Exibe uma lista dos itens do inventário.
  - Command: itemreset
    Aliases:
      - clearinventory
    Help: |
      Remove todos os itens do seu inventário.
  - Command: jail
    Help: |
      Params: <nome do personagem>
      Envia o personagem informado para a prisão.
  - Command: jailfor
    Help: |
      Params: <tempo> <nome do personagem>
      Envia o personagem informado para a prisão pelo tempo especificado.
  - Command: jailtime
    Help: |
      Exibe o tempo restante de prisão.
  - Command: jobchange
    Aliases:
      - job
    Help: |
      Params: <nome ou ID da classe>
      Altera a sua classe.
      ----- Aprendiz / 1ª Classe -----
         0 Novice              1 Swordman            2 Magician            3 Archer
         4 Acolyte              5 Merchant               6 Thief
      ----- 2ª Classe -----
         7 Knight               8 Priest                     9 Wizard               10 Blacksmith
        11 Hunter           12 Assassin            14 Crusader          15 Monk
        16 Sage              17 Rogue                 18 Alchemist         19 Bard
        20 Dancer
      ----- Aprendiz T. / 1ª Classe T. -----
      4001 Novice High     4002 Swordman High    4003 Magician High    4004 Archer High
      4005 Acolyte High     4006 Merchant High       4007 Thief High
      ----- 2ª Classe Transcendente -----
      4008 Lord Knight      4009 High Priest             4010 High Wizard      4011 Whitesmith
      4012 Sniper               4013 Assassin Cross   4015 Paladin              4016 Champion
      4017 Professor         4018 Stalker                    4019 Creator               4020 Clown
      4021 Gypsy
      ----- 3ª Classe (Normal) -----
      4054 Rune Knight    4055 Warlock                 4056 Ranger            4057 Arch Bishop
      4058 Mechanic         4059 Guillotine Cross  4066 Royal Guard   4067 Sorcerer
      4068 Minstrel            4069 Wanderer              4070 Sura                 4071 Genetic
      4072 Shadow Chaser
      ----- 3ª Classe (Transcendente) -----
